<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatura de Palencia</title>
</head>
<body>
    <h1>Temperatura de Palencia</h1>
    
    <h2>Temperaturas</h2>

    <div id="temperaturas"></div>

    <script>
        fetch("/temperaturas")
        .then(respuesta => respuesta.json())
        .then(datos => {
            const contenedor = document.getElementById("temperaturas");

            for(const dia in datos) {
                contenedor.innerHTML += `
                        <p>
                            <strong>${dia}</strong><br>
                            Mínima: ${datos[dia].minima} °C<br>
                            Máxima: ${datos[dia].maxima} °C
                        </p>
                    `;
            }
        })
    </script>
    
</body>
</html>
